name: Build demos and deploy Pages

on:
  push:
    branches: [master, main]
  repository_dispatch:
    types: [walkmode-updated, rebuild-demos]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout walkmode
        uses: actions/checkout@v4
        with:
          repository: adavidev/walkmode
          path: vendor/walkmode

      - name: Checkout arnauts
        uses: actions/checkout@v4
        with:
          repository: adavidev/arnauts
          path: vendor/arnauts

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build walkmode
        working-directory: vendor/walkmode
        run: |
          npm ci || npm install
          npx vite build --base /demos/walkmode/

      - name: Build arnauts
        working-directory: vendor/arnauts/web
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm install @rollup/rollup-linux-x64-gnu --no-save
          npx vite build --base /demos/arnauts/

      - name: Publish demos to master
        run: |
          rm -rf demos/walkmode demos/arnauts
          cp -R vendor/walkmode/dist demos/walkmode
          cp -R vendor/arnauts/web/dist demos/arnauts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demos/walkmode demos/arnauts
          if git diff --staged --quiet; then
            echo "Demos unchanged."
          else
            git commit -m "Rebuild demos from CI."
            git push
          fi

      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/demos
          cp index.html styles.css favicon.svg CNAME dist/ 2>/dev/null || cp index.html styles.css CNAME dist/
          cp -R studio dist/studio
          cp -R demos/mvthrsys dist/demos/mvthrsys
          cp -R demos/walkmode dist/demos/walkmode
          cp -R demos/arnauts dist/demos/arnauts

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
